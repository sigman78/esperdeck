# SSH connection profiles — copy this directory to sim_storage/ and edit.
# One [section] per profile; the section name is shown in the profile picker.

[example]
host=192.168.1.10
port=22
user=me
auth=password
password=changeme

# Public-key auth:
#   auth=key
#   key_id=<name>         -> private key read from keys/<name>.pem (PEM format)
#   password=<passphrase> -> optional; decrypts an encrypted key (omit if none)
#
# Key type notes (mbedTLS crypto backend on the device):
#   - RSA keys work with just keys/<name>.pem (the public key is derived).
#   - ECDSA keys also need the matching public key at keys/<name>.pub.
#   - Ed25519 is not supported by the mbedTLS backend; use RSA or ECDSA.
# Generate an RSA key:  ssh-keygen -t rsa -b 3072 -m PEM -f id_deck
# then copy id_deck -> keys/id_deck.pem and add id_deck.pub to the server.
#[server]
#host=server.local
#port=22
#user=me
#auth=key
#key_id=id_deck
